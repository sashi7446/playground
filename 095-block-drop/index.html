<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Drop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Block Drop</h1>
        <div class="info">Click to drop blocks and stack them!</div>
        <div class="score">Score: <span id="score">0</span> | Blocks: <span id="blocks">0</span>/10</div>
        <div class="game-area" id="gameArea">
            <div id="movingBlock"></div>
        </div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
