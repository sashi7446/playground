<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Click</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Speed Click</h1>
        <div class="info">Click as fast as you can!</div>
        <div class="score">Clicks: <span id="clicks">0</span> | Time: <span id="time">20</span>s</div>
        <div class="game-area" id="gameArea">
            <div id="clickZone">CLICK ME!</div>
        </div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
