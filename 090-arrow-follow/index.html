<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Follow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Arrow Follow</h1>
        <div class="info">Press the arrow keys shown!</div>
        <div class="score">Score: <span id="score">0</span> | Streak: <span id="streak">0</span></div>
        <div class="game-area" id="gameArea">
            <div id="arrow">⬆️</div>
        </div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
