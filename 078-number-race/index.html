<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Race</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Number Race</h1>
        <div class="info">Click to move forward - race to 100!</div>
        <div class="score">Position: <span id="position">0</span>/100</div>
        <div class="game-area" id="gameArea">
            <div id="track">
                <div id="player">🏃</div>
                <div id="finish">🏁</div>
            </div>
        </div>
        <button id="clickBtn" style="display:none;">GO!</button>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
