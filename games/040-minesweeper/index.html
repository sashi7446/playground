<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>040 - Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Minesweeper</h1>
        <div class="stats">
            <div>Cleared: <span id="cleared">0</span>/12</div>
            <div>Mines: <span id="mineCount">4</span></div>
        </div>

        <div class="game-area">
            <div class="minesweeper-grid" id="grid"></div>
        </div>

        <div class="game-status" id="status"></div>
        <button class="reset-btn" id="resetBtn">New Game</button>
        <div class="info">Left click to reveal, right click to flag</div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
