<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>025 - Higher or Lower</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Higher or Lower?</h1>
        <div class="streak">Streak: <span id="streak">0</span></div>

        <div class="card-display">
            <div class="card" id="card">
                <span class="card-value" id="cardValue">?</span>
            </div>
        </div>

        <div class="buttons">
            <button onclick="guess('higher')" class="higher-btn">↑ Higher</button>
            <button onclick="guess('lower')" class="lower-btn">↓ Lower</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
