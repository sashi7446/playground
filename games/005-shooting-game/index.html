<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooting Game - シューティング</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🎯 Shooting Game</h1>
            <p class="game-description">敵を撃ち落として生き残ろう！</p>

            <div class="score-board">
                <div class="score-item">
                    <span class="label">Score</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Wave</span>
                    <span class="value" id="wave">1</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div class="game-info">
            <button id="newGameBtn" class="btn">New Game</button>
        </div>

        <div class="how-to-play">
            <h3>遊び方</h3>
            <ul>
                <li>矢印キーで自分の船を移動</li>
                <li>スペースキーで敵を射撃</li>
                <li>敵をすべて撃ち落とすと次のウェーブ</li>
                <li>敵の弾に当たるとゲームオーバー</li>
            </ul>
        </div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
