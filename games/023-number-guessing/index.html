<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>023 - Number Guessing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Number Guessing</h1>
        <p class="subtitle">Guess the number between 1-100</p>

        <div class="score">Score: <span id="score">0</span></div>

        <div class="hint" id="hint"></div>

        <div class="input-section">
            <input type="number" id="numberInput" min="1" max="100" placeholder="Enter number">
            <button onclick="guess()">Guess</button>
        </div>

        <div class="result" id="result"></div>
        <div class="attempts" id="attempts"></div>

        <button class="reset-btn" onclick="newGame()">New Game</button>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
