<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>032 - Drop Catch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Drop Catch</h1>
        <div class="stats">
            <div>Caught: <span id="score">0</span></div>
            <div>Missed: <span id="missed">0</span></div>
        </div>

        <div class="game-area">
            <div class="basket" id="basket">🧺</div>
            <div class="falling-item" id="fallingItem">🍎</div>
        </div>

        <div class="info">Arrow Left/Right or A/D to move</div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
