<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>031 - Color Match</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Color Match</h1>
        <div class="score">Score: <span id="score">0</span></div>

        <div class="color-name" id="colorName"></div>

        <div class="color-buttons">
            <button class="color-btn" id="btn1" onclick="guess(0)"></button>
            <button class="color-btn" id="btn2" onclick="guess(1)"></button>
            <button class="color-btn" id="btn3" onclick="guess(2)"></button>
            <button class="color-btn" id="btn4" onclick="guess(3)"></button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
