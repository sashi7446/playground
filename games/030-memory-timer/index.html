<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>030 - Memory Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Memory Timer</h1>
        <div class="score">Score: <span id="score">0</span></div>

        <div class="timer-display">
            <div class="number" id="number"></div>
            <div class="time-left">Time: <span id="timeLeft">3</span>s</div>
        </div>

        <input type="text" id="answerInput" placeholder="Remember the number..." disabled>
        <button onclick="submitAnswer()" id="submitBtn" class="submit-btn" disabled>Submit</button>

        <div class="result" id="result"></div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
