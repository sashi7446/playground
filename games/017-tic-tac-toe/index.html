<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Game Collection</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">⭕ Tic Tac Toe</h1>
            <div class="ttt-controls">
                <div class="player-info">
                    <span class="label">Turn:</span>
                    <span class="value" id="currentPlayer">X</span>
                </div>
            </div>
        </div>

        <div id="gameBoard" class="ttt-board"></div>

        <div class="game-info">
            <div class="status-display">
                <p id="status">Game Started - X to play</p>
            </div>
            <div class="button-group">
                <button id="newGameBtn" class="btn">New Game</button>
                <a href="../../launcher.html" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
