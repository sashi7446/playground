<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaker - カジュアルゲーム</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🧱 Block Breaker</h1>
            <p class="game-description">パドルで球を跳ね返してブロックを壊そう！</p>

            <div class="score-board">
                <div class="score-item">
                    <span class="label">Score</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Best</span>
                    <span class="value" id="best">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <div class="game-info">
            <button id="newGameBtn" class="btn">New Game</button>
        </div>

        <div class="how-to-play">
            <h3>遊び方</h3>
            <ul>
                <li>マウスまたはタッチでパドルを動かす</li>
                <li>球を跳ね返してブロックを壊す</li>
                <li>球が下に落ちるとゲームオーバー</li>
                <li>すべてのブロックを壊したらクリア！</li>
            </ul>
        </div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
