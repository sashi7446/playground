<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>019 - Pong Volley</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Pong Volley</h1>
            <div class="difficulty-selector">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <div class="game-info">
            <div class="score-display">
                <span>Player: <span id="playerScore">0</span></span>
                <span>AI: <span id="aiScore">0</span></span>
            </div>
            <div class="game-status" id="gameStatus">Playing...</div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="controls">
            <p>Arrow Keys or WASD to move in any direction</p>
            <p>Move into opponent's side = foul!</p>
        </div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
