<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shogi - Game Collection</title>
    <link rel="stylesheet" href="../../shared/styles/common.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">♟️ Shogi（将棋）</h1>
            <div class="shogi-controls">
                <div class="player-info">
                    <span class="label">Turn:</span>
                    <span class="value" id="currentTurn">Black(先手)</span>
                </div>
                <div class="difficulty-select">
                    <label for="difficulty">難易度:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="gameBoard" class="shogi-board"></div>

        <div class="game-info">
            <div class="status-display">
                <p id="status">Game Starting...</p>
            </div>
            <div class="captured-pieces">
                <div class="captured-black">
                    <h4>Black's Captured</h4>
                    <div id="capturedBlack" class="pieces-list"></div>
                </div>
                <div class="captured-white">
                    <h4>White's Captured</h4>
                    <div id="capturedWhite" class="pieces-list"></div>
                </div>
            </div>
            <div class="button-group">
                <button id="newGameBtn" class="btn">New Game</button>
                <button id="undoBtn" class="btn btn-secondary">Undo</button>
                <a href="../../launcher.html" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>

    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
