<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>049 - Quiz Show</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Quiz Show</h1>
        <div class="stats"><div>Score: <span id="score">0</span></div></div>
        <div class="game-area">
            <div class="question" id="question">Question?</div>
            <div class="options">
                <button class="option-btn" id="opt0"></button>
                <button class="option-btn" id="opt1"></button>
                <button class="option-btn" id="opt2"></button>
                <button class="option-btn" id="opt3"></button>
            </div>
        </div>
        <div class="info">Answer as many questions as you can!</div>
    </div>
    <script src="../../shared/utils/gameUtils.js"></script>
    <script src="game.js"></script>
</body>
</html>
