<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Painter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Number Painter</h1>
        <div class="info">Click numbers 1-20 in order!</div>
        <div class="score">Current: <span id="current">1</span>/20 | Time: <span id="time">0</span>s</div>
        <div class="game-area" id="gameArea"></div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
