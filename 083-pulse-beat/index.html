<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Beat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Pulse Beat</h1>
        <div class="info">Click in rhythm with the pulse!</div>
        <div class="score">Score: <span id="score">0</span> | Streak: <span id="streak">0</span></div>
        <div class="game-area" id="gameArea">
            <div id="pulse"></div>
            <div id="clickZone">CLICK ON BEAT!</div>
        </div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
