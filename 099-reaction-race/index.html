<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Race</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Reaction Race</h1>
        <div class="info">Click when the color changes to GREEN!</div>
        <div class="score">Best: <span id="best">---</span>ms | Round: <span id="round">1</span>/5</div>
        <div class="game-area" id="gameArea">
            <div id="reactionBox">Wait...</div>
        </div>
        <button id="startBtn">Start Game</button>
    </div>
    <script src="../game-storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
