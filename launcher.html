<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームコレクション - 100 Games</title>
    <link rel="stylesheet" href="shared/styles/common.css">
    <link rel="stylesheet" href="launcher-styles.css">
</head>
<body>
    <div class="launcher-container">
        <header class="launcher-header">
            <h1 class="launcher-title">🎮 Game Collection</h1>
            <p class="launcher-subtitle">100のゲームで楽しむ！</p>
        </header>

        <div class="launcher-content">
            <div class="games-grid" id="gamesGrid">
                <!-- ゲームカード がここに動的に生成されます -->
            </div>
        </div>

        <footer class="launcher-footer">
            <p>Created with JavaScript | Made for fun and learning</p>
        </footer>
    </div>

    <script src="launcher.js"></script>
</body>
</html>
